<text x="64.0" y="778.0" text-anchor="start"><tspan fill="#55534e" font-size="13.5" font-weight="700">Method.</tspan><tspan fill="#8a877f" font-size="13.5" font-weight="400" dx="5">Every model runs at its lowest reasoning setting. Latency comes from a separate test: the same recorded calls replayed against every model,</tspan></text>
<text x="64.0" y="799.0" fill="#8a877f" font-size="13.5" text-anchor="start" font-weight="400">one request at a time, over its provider&#x27;s public API, from the cloud region nearest the provider (Mumbai or Virginia). It is the 90th percentile of time to</text>
<text x="64.0" y="820.0" fill="#8a877f" font-size="13.5" text-anchor="start" font-weight="400">first token on warm turns, after the opening one: 9 turns in 10 start sooner. Vertical lines are 95% intervals of the MTVA Score. The frontier joins the</text>
<text x="64.0" y="841.0" fill="#8a877f" font-size="13.5" text-anchor="start" font-weight="400">models no other model beats on both score and speed.</text>
<text x="1136.0" y="841.0" fill="#111111" font-size="16" text-anchor="end" font-weight="700">smallest.ai</text>
