<text x="64.0" y="824.0" text-anchor="start"><tspan fill="#55534e" font-size="13.5" font-weight="700">Method.</tspan><tspan fill="#8a877f" font-size="13.5" font-weight="400" dx="5">The judge reads the whole call and rates its outcome: the caller&#x27;s goal reached, an accepted alternative, partly reached, not reached, or a</tspan></text>
<text x="64.0" y="845.0" fill="#8a877f" font-size="13.5" text-anchor="start" font-weight="400">wrong result. A goal reached without the caller hearing everything they needed scores one level lower. Each capability is scored 1 to 5 per call from</text>
<text x="64.0" y="866.0" fill="#8a877f" font-size="13.5" text-anchor="start" font-weight="400">the judge&#x27;s verdicts and mapped to 0 to 100. Intervals are 95%, bootstrapped by agent. Every model runs at its lowest reasoning setting.</text>
<text x="1136.0" y="866.0" fill="#111111" font-size="16" text-anchor="end" font-weight="700">smallest.ai</text>
