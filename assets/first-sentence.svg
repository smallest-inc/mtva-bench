<text x="64.0" y="845.0" fill="#8a877f" font-size="13.5" text-anchor="start" font-weight="400">replayed against every model, one request at a time, over its provider&#x27;s public API, from the cloud region nearest the provider (Mumbai or Virginia).</text>
<text x="64.0" y="866.0" fill="#8a877f" font-size="13.5" text-anchor="start" font-weight="400">Tool steps before the agent speaks count; the mock tools&#x27; own time does not. 90th percentile of warm turns, after the opening one: 9 turns in 10 are</text>
<text x="64.0" y="887.0" fill="#8a877f" font-size="13.5" text-anchor="start" font-weight="400">faster.</text>
