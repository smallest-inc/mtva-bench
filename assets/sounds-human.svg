<text x="64.0" y="758.0" text-anchor="start"><tspan fill="#55534e" font-size="13.5" font-weight="700">Method.</tspan><tspan fill="#8a877f" font-size="13.5" font-weight="400" dx="5">Judge: Claude Opus 5.5, reading only what each agent said aloud, with no system prompt, tools or model names. Electron 2.0&#x27;s call was</tspan></text>
<text x="64.0" y="779.0" fill="#8a877f" font-size="13.5" text-anchor="start" font-weight="400">shown first in half of the scenarios against each model. Lines after each share are its 95% interval, bootstrapped by agent. The judge preferred</text>
