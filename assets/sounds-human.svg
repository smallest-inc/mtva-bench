<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="719" viewBox="0 0 1200 719" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" role="img">
<title>A blind judge found Electron 2.0 more human than all 6 models it faced</title>
<desc>Electron 2.0 against each model on how human it sounds.</desc>
<rect x="0.5" y="0.5" width="1199" height="718" rx="18" fill="#fbfbf9" stroke="#ebe9e4"/>
<circle cx="68" cy="67" r="4.5" fill="#2a78d6"/>
<text x="80.0" y="72.0" fill="#8a877f" font-size="13" text-anchor="start" font-weight="600" letter-spacing="1.6">BLIND HEAD-TO-HEAD · MODEL NAMES HIDDEN</text>
<text x="64.0" y="124.0" fill="#111111" font-size="36" text-anchor="start" font-weight="700" letter-spacing="-0.9">A blind judge found Electron 2.0 more human than all 6 models</text>
<text x="64.0" y="168.0" fill="#111111" font-size="36" text-anchor="start" font-weight="700" letter-spacing="-0.9">it faced</text>
<text x="64.0" y="204.0" fill="#55534e" font-size="17" text-anchor="start" font-weight="400">Same scenario, two calls, labelled only A and B. Share of 600 calls each side won.</text>
<text x="547.4" y="280.0" fill="#8a877f" font-size="13" text-anchor="end" font-weight="600">← other model preferred</text>
<text x="567.4" y="280.0" fill="#111111" font-size="13" text-anchor="start" font-weight="700">Electron 2.0 preferred →</text>
<text x="64.0" y="328.0" fill="#111111" font-size="15" text-anchor="start" font-weight="600">vs GPT-4.1</text>
<path d="M555.9,311.0 H554.1 Q552.3,311.0 552.3,312.8 V333.2 Q552.3,335.0 554.1,335.0 H555.9 Z" fill="#d9d6cf"/>
<path d="M558.9,311.0 H850.3 Q855.3,311.0 855.3,316.0 V330.0 Q855.3,335.0 850.3,335.0 H558.9 Z" fill="#2a78d6"/>
<text x="543.8" y="328.0" fill="#55534e" font-size="14" text-anchor="end" font-weight="400" font-variant-numeric="tabular-nums">1%</text>
<text x="865.8" y="328.0" text-anchor="start"><tspan fill="#111111" font-size="16" font-weight="700">99%</tspan><tspan fill="#8a877f" font-size="13" font-weight="400" dx="8">98–100</tspan></text>
<text x="64.0" y="374.0" fill="#111111" font-size="15" text-anchor="start" font-weight="600">vs Claude Haiku 5.5</text>
<path d="M555.9,357.0 H545.0 Q540.0,357.0 540.0,362.0 V376.0 Q540.0,381.0 545.0,381.0 H555.9 Z" fill="#d9d6cf"/>
<path d="M558.9,357.0 H838.0 Q843.0,357.0 843.0,362.0 V376.0 Q843.0,381.0 838.0,381.0 H558.9 Z" fill="#2a78d6"/>
<text x="531.5" y="374.0" fill="#55534e" font-size="14" text-anchor="end" font-weight="400" font-variant-numeric="tabular-nums">5%</text>
<text x="853.5" y="374.0" text-anchor="start"><tspan fill="#111111" font-size="16" font-weight="700">95%</tspan><tspan fill="#8a877f" font-size="13" font-weight="400" dx="8">92–97</tspan></text>
<text x="64.0" y="420.0" fill="#111111" font-size="15" text-anchor="start" font-weight="600">vs GPT-6.1 Terra</text>
<path d="M555.9,403.0 H532.4 Q527.4,403.0 527.4,408.0 V422.0 Q527.4,427.0 532.4,427.0 H555.9 Z" fill="#d9d6cf"/>
<path d="M558.9,403.0 H825.4 Q830.4,403.0 830.4,408.0 V422.0 Q830.4,427.0 825.4,427.0 H558.9 Z" fill="#2a78d6"/>
<text x="518.9" y="420.0" fill="#55534e" font-size="14" text-anchor="end" font-weight="400" font-variant-numeric="tabular-nums">10%</text>
<text x="840.9" y="420.0" text-anchor="start"><tspan fill="#111111" font-size="16" font-weight="700">90%</tspan><tspan fill="#8a877f" font-size="13" font-weight="400" dx="8">87–94</tspan></text>
<text x="64.0" y="466.0" fill="#111111" font-size="15" text-anchor="start" font-weight="600">vs GPT-6.1 Sol</text>
<path d="M555.9,449.0 H527.0 Q522.0,449.0 522.0,454.0 V468.0 Q522.0,473.0 527.0,473.0 H555.9 Z" fill="#d9d6cf"/>
<path d="M558.9,449.0 H820.0 Q825.0,449.0 825.0,454.0 V468.0 Q825.0,473.0 820.0,473.0 H558.9 Z" fill="#2a78d6"/>
<text x="513.5" y="466.0" fill="#55534e" font-size="14" text-anchor="end" font-weight="400" font-variant-numeric="tabular-nums">11%</text>
<text x="835.5" y="466.0" text-anchor="start"><tspan fill="#111111" font-size="16" font-weight="700">89%</tspan><tspan fill="#8a877f" font-size="13" font-weight="400" dx="8">85–92</tspan></text>
<text x="64.0" y="512.0" fill="#111111" font-size="15" text-anchor="start" font-weight="600">vs Claude Sonnet 5.5</text>
<path d="M555.9,495.0 H482.0 Q477.0,495.0 477.0,500.0 V514.0 Q477.0,519.0 482.0,519.0 H555.9 Z" fill="#d9d6cf"/>
<path d="M558.9,495.0 H775.0 Q780.0,495.0 780.0,500.0 V514.0 Q780.0,519.0 775.0,519.0 H558.9 Z" fill="#2a78d6"/>
<text x="468.5" y="512.0" fill="#55534e" font-size="14" text-anchor="end" font-weight="400" font-variant-numeric="tabular-nums">26%</text>
<text x="790.5" y="512.0" text-anchor="start"><tspan fill="#111111" font-size="16" font-weight="700">74%</tspan><tspan fill="#8a877f" font-size="13" font-weight="400" dx="8">68–78</tspan></text>
<text x="64.0" y="558.0" fill="#111111" font-size="15" text-anchor="start" font-weight="600">vs Claude Opus 5.5</text>
<path d="M555.9,541.0 H449.3 Q444.3,541.0 444.3,546.0 V560.0 Q444.3,565.0 449.3,565.0 H555.9 Z" fill="#d9d6cf"/>
<path d="M558.9,541.0 H742.3 Q747.3,541.0 747.3,546.0 V560.0 Q747.3,565.0 742.3,565.0 H558.9 Z" fill="#2a78d6"/>
<text x="435.8" y="558.0" fill="#55534e" font-size="14" text-anchor="end" font-weight="400" font-variant-numeric="tabular-nums">37%</text>
<text x="757.8" y="558.0" text-anchor="start"><tspan fill="#111111" font-size="16" font-weight="700">63%</tspan><tspan fill="#8a877f" font-size="13" font-weight="400" dx="8">57–69</tspan></text>
<line x1="557.4" y1="294.0" x2="557.4" y2="580.0" stroke="#d3d0c9" stroke-width="1.5" stroke-opacity="1" stroke-linecap="round"/>
<text x="64.0" y="620.0" text-anchor="start"><tspan fill="#55534e" font-size="13.5" font-weight="700">Method.</tspan><tspan fill="#8a877f" font-size="13.5" font-weight="400" dx="5">Judge: Claude Opus 5.5, reading only what each agent said aloud, with no system prompt, tools or model names. Electron 2.0&#x27;s call was</tspan></text>
<text x="64.0" y="641.0" fill="#8a877f" font-size="13.5" text-anchor="start" font-weight="400">shown first in half of the scenarios against each model. Lines after each share are its 95% interval, bootstrapped by agent. The judge preferred</text>
<text x="64.0" y="662.0" fill="#8a877f" font-size="13.5" text-anchor="start" font-weight="400">Electron 2.0 even over itself.</text>
<text x="1136.0" y="662.0" fill="#111111" font-size="16" text-anchor="end" font-weight="700">smallest.ai</text>
</svg>
