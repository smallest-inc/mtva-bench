<text x="64.0" y="845.0" fill="#8a877f" font-size="13.5" text-anchor="start" font-weight="400">never run, and rates each one minor, major or critical. Each capability is scored 1 to 5 per call from the judge&#x27;s verdicts and mapped to 0 to 100.</text>
<text x="64.0" y="866.0" fill="#8a877f" font-size="13.5" text-anchor="start" font-weight="400">Intervals are 95%, bootstrapped by agent. Every model runs at its lowest reasoning setting.</text>
