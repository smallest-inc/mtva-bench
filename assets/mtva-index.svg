<text x="64.0" y="850.0" text-anchor="start"><tspan fill="#55534e" font-size="13.5" font-weight="700">Method.</tspan><tspan fill="#8a877f" font-size="13.5" font-weight="400" dx="5">The MTVA Index is a weighted geometric mean of three parts, each from 0 to 100: the MTVA Score (50%), speed (30%) and cost (20%).</tspan></text>
<text x="64.0" y="871.0" fill="#8a877f" font-size="13.5" text-anchor="start" font-weight="400">Speed is time to first token at the 90th percentile, on a log scale from 200 ms (100) to 10 s (0). Cost is the cost of one call, on a log scale from $0.001</text>
<text x="64.0" y="892.0" fill="#8a877f" font-size="13.5" text-anchor="start" font-weight="400">(100) to $1 (0). In a geometric mean a strong part cannot make up for a poor one. Lines are 95% intervals, carried over from the MTVA Score.</text>
<text x="1136.0" y="892.0" fill="#111111" font-size="16" text-anchor="end" font-weight="700">smallest.ai</text>
</svg>
