<text x="64.0" y="845.0" fill="#8a877f" font-size="13.5" text-anchor="start" font-weight="400">right order. A missed or wrong action costs more the more it matters to the business. Each capability is scored 1 to 5 per call from the judge&#x27;s verdicts</text>
<text x="64.0" y="866.0" fill="#8a877f" font-size="13.5" text-anchor="start" font-weight="400">and mapped to 0 to 100. Intervals are 95%, bootstrapped by agent. Every model runs at its lowest reasoning setting.</text>
