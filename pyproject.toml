[project]
name = "mtva-bench"
dynamic = ["version"]
description = "Multi-Turn Voice Agent Benchmark: how well an LLM runs a voice-agent phone call"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Smallest AI" }]
requires-python = ">=3.10"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.urls]
Repository = "https://github.com/smallest-inc/mtva-bench"

[project.scripts]
mtva-bench = "mtva_bench.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "mtva_bench/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["mtva_bench"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pyright]
include = ["mtva_bench"]
pythonVersion = "3.10"
